<!DOCTYPE html>

<body>
<div id="khung" style="display:flex;flex-wrap:wrap;align-items:stretch;min-height:900px;background:#FBF7F1">

<!-- THANH CẤU TRÚC BÊN TRÁI -->
<main id="noi-dung" style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column"></main>
</div>
<template id="tpl-home">
<!-- Banner -->
<section data-s="trang-chu" style="position:relative;overflow:hidden;box-sizing:border-box;padding:110px 64px;border-bottom:4px solid #AD532F">
<div aria-hidden="true" style="position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;background:#b8bfc6;color:#fff;font-size:14px;letter-spacing:0.08em">[ẢNH NỀN CÔNG TRÌNH]</div>
<div aria-hidden="true" style="position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(255,255,255,0.88)"></div>

<h2 style="margin:0;font-size:40px;font-weight:800;line-height:1.2;color:#85391d">Giới thiệu</h2>

<a class="more" href="#gioi-thieu" style="font-weight:600;font-size:16px">Xem trang Giới thiệu →</a>

<!-- Dự án -->
